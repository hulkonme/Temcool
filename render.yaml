services:
  - type: web
    name: temcool
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: PGSSL
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: temcool-db
          property: connectionString

databases:
  - name: temcool-db
    plan: free
    databaseName: temcool
    user: temcool
